# Render Blueprint for the TradingView trading bot (see trading-bot/README.md, "Deploy online").
services:
  - type: web
    name: tradingview-bot
    runtime: docker
    dockerContext: ./trading-bot
    dockerfilePath: ./trading-bot/Dockerfile
    # Starter never sleeps. The free plan sleeps when idle, and TradingView gives up on a
    # webhook after a few seconds, so alerts would be lost while it wakes up.
    plan: starter
    # Closest Render region to Canada. (If you ever use Binance, change to frankfurt:
    # Binance blocks API calls from US servers.)
    region: ohio
    healthCheckPath: /health
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
    # Settings you change in the Render dashboard are `sync: false`, so a Blueprint sync never
    # overwrites them (a sync once reset a live BROKER=kraken back to paper). Fill them in on the
    # first deploy; suggested starting values are in the comments.
    envVars:
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BROKER  # paper, or kraken for real money
        sync: false
      - key: LIVE_TRADING  # false; true only for real money
        sync: false
      # The bot reads Kraken's daily BTC/CAD chart itself and trades Trend (200 SMA).
      - key: AUTO_TRADE_SYMBOL  # BTCCAD
        sync: false
      - key: MAX_POSITION_USD  # 100 (CAD per crypto buy)
        sync: false
      - key: MAX_DAILY_LOSS_USD  # 30
        sync: false
      - key: MAX_TRADES_PER_DAY  # 10
        sync: false
      - key: JOURNAL_PATH
        value: /data/trades.jsonl
      - key: STATE_PATH
        value: /data/positions.json
      - key: KRAKEN_KEY
        sync: false
      - key: KRAKEN_SECRET
        sync: false
      # Stock bot (Interactive Brokers through a separate ib-gateway private service; see README).
      - key: STOCK_SYMBOLS  # e.g. SPY,QQQ,NVDA,META,TSLA,GOOGL,MSFT; empty = off
        sync: false
      - key: STOCK_POSITION_USD  # 1000 (USD per stock buy)
        sync: false
      - key: IBKR_HOST  # the ib-gateway service's internal address, e.g. ib-gateway-xxxx
        sync: false
      - key: IBKR_PORT  # 4004 = paper
        sync: false
      - key: STOCK_STATE_PATH
        value: /data/stock_positions.json
      - key: STOCK_JOURNAL_PATH
        value: /data/stock_trades.jsonl
      # Covered calls on some of the stock symbols (paper first). Empty = off.
      - key: COVERED_CALL_SYMBOLS  # e.g. NVDA
        sync: false
      - key: CC_MAX_SHARES_USD  # 30000: max spent topping up to 100 shares
        sync: false
      - key: CC_STATE_PATH
        value: /data/covered_calls.json
      # News pause: Claude reads headlines and blocks NEW buys after severe bad news (never sells).
      - key: NEWS_PAUSE_ENABLED  # true to turn on (needs ANTHROPIC_API_KEY)
        sync: false
      - key: ANTHROPIC_API_KEY  # from console.anthropic.com
        sync: false
      - key: NEWS_MODEL  # empty = claude-opus-5-5; claude-haiku-4-5 is cheaper
        sync: false
      - key: NEWS_STATE_PATH
        value: /data/news_pauses.json
      - key: BINANCE_KEY
        sync: false
      - key: BINANCE_SECRET
        sync: false
      - key: ALPACA_KEY
        sync: false
      - key: ALPACA_SECRET
        sync: false
