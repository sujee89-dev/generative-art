plugins {
    id "com.android.application"
}

android {
    namespace "com.ahara.readingroom"
    compileSdk 34

    defaultConfig {
        applicationId "com.ahara.readingroom"
        minSdk 22          // Fire OS 5 and newer
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1." + (System.getenv("VERSION_CODE") ?: "0")
    }

    buildFeatures {
        buildConfig true
    }

    // One app per child. Both share the web app in assets/www/shared and differ only in
    // which page they open, their name, icon and where they look for updates.
    flavorDimensions "child"
    productFlavors {
        ahara {
            dimension "child"
            applicationId "com.ahara.readingroom"
            buildConfigField "String", "START_URL", '"file:///android_asset/www/ahara/index.html"'
            buildConfigField "String", "VERSION_URL", '"https://sujee89-dev.github.io/generative-art/downloads/version.json"'
            buildConfigField "String", "DOWNLOAD_PAGE", '"https://sujee89-dev.github.io/generative-art/downloads/"'
        }
        aria {
            dimension "child"
            applicationId "com.aria.readingroom"
            buildConfigField "String", "START_URL", '"file:///android_asset/www/aria/index.html"'
            buildConfigField "String", "VERSION_URL", '"https://sujee89-dev.github.io/generative-art/downloads/aria/version.json"'
            buildConfigField "String", "DOWNLOAD_PAGE", '"https://sujee89-dev.github.io/generative-art/downloads/aria/"'
        }
    }

    signingConfigs {
        release {
            // A dedicated key for this family app, kept in the repo so every build can
            // install over the last one without losing progress saved on the tablet.
            storeFile file("../keystore/ahara.jks")
            storePassword "ahara-reading-room"
            keyAlias "ahara"
            keyPassword "ahara-reading-room"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
