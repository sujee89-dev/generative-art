<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ahara's Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Thambi+2:wght@500;800&family=Sniglet:wght@400;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --sky: #dff1f7;
    --paper: #fffdf7;
    --ink: #1d3557;
    --ink-soft: #52698a;
    --sun: #ffc93c;
    --berry: #e84a7f;
    --leaf: #3fa66b;
    --wave: #2f8fd8;
    --plum: #8a5cc7;
    --orange: #f28a2e;
    --line: #c9dde8;
    --ok: #3fa66b;
    --oops: #e8603c;
    --read: "Andika", "Baloo Thambi 2", "Noto Sans Tamil", "Comic Sans MS", system-ui, sans-serif;
    --fun: "Sniglet", "Baloo Thambi 2", "Andika", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--sky);
    color: var(--ink);
    font-family: var(--read);
    font-size: 18px;
    overflow-x: hidden;
  }
  button { font-family: inherit; }
  button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px dashed var(--ink); outline-offset: 2px; }

  /* ---------- backdrop: her name, big and soft ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .backdrop span {
    position: absolute; font-family: var(--fun); font-weight: 800; line-height: 1;
    opacity: .13; white-space: nowrap;
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translateY(0) rotate(var(--r)); }
    to   { transform: translateY(-24px) rotate(calc(var(--r) + 4deg)); }
  }

  .wrap {
    position: relative; z-index: 1;
    max-width: 880px; margin: 0 auto;
    padding-inline: 16px; padding-block: 16px 48px;
    display: flex; flex-direction: column; gap: 16px;
  }

  /* ---------- header ---------- */
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .hello { font-family: var(--fun); font-size: 1.05rem; color: var(--ink-soft); margin: 0; }
  .name {
    display: flex; gap: 2px; margin: 0; font-family: var(--fun); font-weight: 800;
    font-size: clamp(3rem, 12vw, 5.2rem); line-height: 1.05;
  }
  .name button {
    all: unset; cursor: pointer; display: inline-block; transition: transform .15s;
    text-shadow: 0 4px 0 rgba(29,53,87,.15);
  }
  .name button:hover { transform: translateY(-4px) rotate(-4deg); }
  .name button:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; border-radius: 8px; }
  .name button.pop { animation: pop .45s; }
  @keyframes pop { 50% { transform: scale(1.3) rotate(8deg); } }
  .sub { font-family: var(--fun); font-size: 1.15rem; margin: 4px 0 0; }

  .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .control-row { display: flex; gap: 8px; align-items: center; }
  .stars {
    font-family: var(--fun); font-size: 1.3rem; background: var(--paper);
    border: 3px solid var(--sun); border-radius: 999px; padding: 4px 16px;
    font-variant-numeric: tabular-nums;
  }
  .sound-btn {
    font: 700 1rem var(--fun); background: var(--paper); color: var(--ink); cursor: pointer;
    border: 3px solid var(--line); border-radius: 999px; padding: 6px 12px;
  }
  .sound-btn.speaking { border-color: var(--leaf); background: #e6f6ec; }
  .lang { display: flex; background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 3px; }
  .lang button {
    font: 700 1rem var(--fun); border: 0; background: transparent; color: var(--ink);
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* ---------- tabs ---------- */
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  nav > button { flex: 1 1 0; min-width: 84px; }
  nav button {
    font: 700 .92rem/1.15 var(--fun); text-align: center; color: var(--ink); cursor: pointer;
    background: var(--paper); border: 3px solid var(--line); border-radius: 18px;
    padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav button .ic { font-size: 1.6rem; line-height: 1; }
  nav button[aria-selected="true"] { border-color: var(--tab, var(--wave)); background: var(--tab, var(--wave)); color: #fff; }

  .panel { background: var(--paper); border-radius: 28px; padding: 20px; box-shadow: 0 6px 0 var(--line); }
  .panel h2 { font-family: var(--fun); font-size: 1.5rem; margin: 0 0 4px; text-wrap: balance; }
  .hint { color: var(--ink-soft); margin: 0 0 14px; }
  .meta { color: var(--ink-soft); font-size: .9rem; text-align: center; margin: 12px 0 0; font-variant-numeric: tabular-nums; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .chips button {
    font: 700 .95rem var(--fun); cursor: pointer; color: var(--ink);
    background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px;
  }
  .chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  .btn {
    font: 700 1.1rem var(--fun); cursor: pointer; border: 0; border-radius: 999px;
    padding: 12px 22px; background: var(--wave); color: #fff; box-shadow: 0 4px 0 rgba(29,53,87,.25);
  }
  .btn.alt { background: #fff; color: var(--ink); border: 3px solid var(--line); box-shadow: none; }
  .btn.go { background: var(--leaf); }
  .btn:active { transform: translateY(2px); box-shadow: none; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

  /* ---------- letters ---------- */
  .alpha { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
  .alpha button {
    font: 700 1.9rem var(--read); aspect-ratio: 1; max-width: 100%; cursor: pointer;
    border: 3px solid var(--line); border-radius: 16px; background: #fff; color: var(--ink);
  }
  .alpha button.in-name { border-color: var(--berry); color: var(--berry); }
  .alpha button.on { background: var(--sun); border-color: var(--sun); color: var(--ink); }
  .letter-card {
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px 24px;
    margin-bottom: 18px; padding: 16px; border-radius: 20px; background: var(--sky);
  }
  .big-letter { font: 700 5rem/1 var(--read); color: var(--berry); }
  .big-letter small { font-size: .6em; color: var(--ink); }
  .pic { font-size: 3.6rem; line-height: 1.1; }
  .letter-card .word { font: 700 2rem var(--read); }
  .letter-card .word b { color: var(--berry); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .note { font-family: var(--fun); color: var(--berry); margin: 4px 0 0; }

  /* ---------- words ---------- */
  .word-stage { text-align: center; padding: 4px 0 8px; }
  .word-stage .pic { font-size: 5.5rem; min-height: 1.1em; }
  .word-stage .pic.none { font-size: 2.2rem; color: var(--line); display: grid; place-items: center; }
  .syll { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin: 14px 0 18px; }
  .syll button {
    font: 700 clamp(2rem, 9vw, 3.2rem) var(--read); cursor: pointer; color: var(--ink);
    background: #fff; border: 3px solid var(--line); border-radius: 16px; padding: 4px 14px;
  }
  .syll button:nth-child(odd) { border-bottom-color: var(--wave); }
  .syll button:nth-child(even) { border-bottom-color: var(--berry); }
  .syll button.on { background: var(--sun); }

  /* ---------- sentences and book pages ---------- */
  .sentence-card {
    display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;
    padding: 20px 12px; border-radius: 24px; background: var(--sky);
  }
  .sentence-card .pic { font-size: clamp(4rem, 18vw, 6rem); }
  .words { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; font: 700 clamp(1.6rem, 6vw, 2.4rem)/1.35 var(--read); }
  .words button { all: unset; cursor: pointer; border-radius: 8px; padding: 0 4px; }
  .words button:focus-visible { outline: 3px dashed var(--ink); }
  .words button.hi { background: var(--sun); }
  .words button.her { color: var(--berry); }

  /* ---------- play ---------- */
  .quiz-word { text-align: center; font: 700 clamp(2.6rem, 12vw, 4rem) var(--read); margin: 8px 0 18px; }
  .quiz-word .blank { color: var(--berry); border-bottom: 5px solid var(--berry); padding: 0 .1em; }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 520px; margin-inline: auto; }
  .choices button {
    font-size: clamp(3rem, 14vw, 4.5rem); cursor: pointer; aspect-ratio: 1; max-width: 100%;
    background: #fff; border: 4px solid var(--line); border-radius: 24px; color: var(--ink);
  }
  .choices.text button { aspect-ratio: auto; min-height: 96px; font: 700 clamp(1.5rem, 6vw, 2.2rem) var(--read); padding: 8px; overflow-wrap: anywhere; }
  .choices button.right { border-color: var(--ok); background: #e6f6ec; animation: pop .45s; }
  .choices button.wrong { border-color: var(--oops); animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .big-ear { font-size: 4.5rem; background: none; border: 0; cursor: pointer; display: block; margin: 0 auto 12px; }
  .feedback { text-align: center; min-height: 2.2em; font: 800 1.5rem var(--fun); margin: 14px 0 6px; }
  .feedback.good { color: var(--ok); }
  .feedback.bad { color: var(--oops); }
  .progress { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
  .progress i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .progress i.done { background: var(--sun); }
  .celebrate { text-align: center; font: 800 1.8rem var(--fun); color: var(--berry); margin: 18px 0; text-wrap: balance; }

  /* ---------- books ---------- */
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .book {
    position: relative; cursor: pointer; text-align: left; color: var(--ink);
    display: flex; flex-direction: column; gap: 6px; padding: 12px;
    background: #fff; border: 3px solid var(--line); border-radius: 18px;
  }
  .book .cover { font-size: 3rem; line-height: 1.1; }
  .book .t { font: 700 1.05rem/1.2 var(--read); }
  .book .lv { font-size: .8rem; color: var(--ink-soft); }
  .book .done { position: absolute; top: 8px; right: 10px; font: 800 .8rem var(--fun); color: var(--ok); }
  .book.machine { background: var(--sun); border-color: var(--sun); }
  .book.machine .lv { color: var(--ink); }
  .section-title { font: 700 1.1rem var(--fun); margin: 22px 0 8px; }
  .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .links a {
    display: block; text-decoration: none; color: var(--ink); padding: 12px 14px;
    background: var(--sky); border-radius: 16px;
  }
  .links a b { display: block; font-family: var(--fun); }
  .links a span { font-size: .9rem; color: var(--ink-soft); }
  .reader-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .reader-top h2 { margin: 0; }
  .page-card { min-height: 320px; justify-content: center; }
  .page-num { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .the-end { font: 800 clamp(2.4rem, 10vw, 3.4rem) var(--fun); color: var(--berry); }

  /* ---------- English meaning under French and Tamil ---------- */
  small.en { display: block; font: 400 .72em/1.25 var(--read); color: var(--ink-soft); letter-spacing: 0; text-transform: none; margin-top: 2px; }
  .btn small.en, .chips small.en { color: inherit; opacity: .8; }
  nav button small.en { font-size: .62rem; opacity: .85; margin: 0; }
  nav button[aria-selected="true"] small.en { color: #fff; }
  h2 small.en { font-size: .58em; margin-top: 4px; }
  .celebrate small.en { font-size: .55em; }
  .gloss { display: block; font: 400 1rem/1.3 var(--read); color: var(--ink-soft); margin: 4px 0 0; }
  .gloss.big { font-size: clamp(1.05rem, 4vw, 1.3rem); margin: 0; }
  .quiz-word .gloss { text-align: center; }

  /* ---------- Tamil letters ---------- */
  .ta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; }
  .ta-grid.family { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  .ta-tile {
    position: relative; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: #fff; color: var(--ink); border: 3px solid var(--line); border-radius: 16px; padding: 8px 4px;
  }
  .ta-tile .tl, .choices .tl { font: 700 1.9rem/1.2 var(--read); }
  .ta-grid.family .tl { font-size: 2.3rem; }
  .ta-tile .tr, .choices .tr { font: 400 .8rem var(--read); color: var(--ink-soft); }
  .ta-tile.heard::after { content: ""; position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .ta-tile.on { background: var(--sun); border-color: var(--sun); }
  .cons-pick button { font: 700 1.2rem var(--read); min-width: 44px; }
  .chart-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-inline: -4px; padding: 4px; }
  .ta-chart { border-collapse: separate; border-spacing: 4px; }
  .ta-chart th { background: var(--sky); border-radius: 10px; padding: 4px 6px; display: table-cell; }
  .ta-chart th .tl { display: block; font: 700 1.3rem var(--read); color: var(--berry); }
  .ta-chart th .tr { display: block; font-size: .72rem; color: var(--ink-soft); }
  .ta-chart .ta-tile { min-width: 58px; padding: 4px 2px; border-width: 2px; border-radius: 12px; }
  .ta-chart .ta-tile .tl { font-size: 1.45rem; }
  .ta-chart .ta-tile .tr { font-size: .68rem; }
  #taCard { margin-top: 4px; }
  #taCard .roman { font: 700 1.6rem var(--fun); color: var(--wave); }
  #taCard .how { font: 700 1.3rem var(--read); color: var(--ink-soft); margin: 4px 0; }
  .meter { height: 12px; background: var(--sky); border-radius: 999px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--leaf), var(--sun)); border-radius: 999px; }
  .section-title small.en { font-size: .78em; }

  /* ---------- math ---------- */
  .math-ask { text-align: center; font: 700 clamp(1.3rem, 5vw, 1.7rem) var(--fun); margin: 6px 0 10px; text-wrap: balance; }
  .math-show { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 16px; }
  .equation { font: 700 clamp(2.4rem, 11vw, 3.6rem) var(--read); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .equation .blank, .math-show .blank { color: var(--berry); border-bottom: 5px solid var(--berry); padding: 0 .15em; }
  .objects { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; font-size: 2.2rem; max-width: 520px; }
  .objects.small { font-size: 1.5rem; }
  .objects .op { font: 800 2rem var(--fun); color: var(--ink-soft); margin-inline: 8px; align-self: center; }
  .objects .gone { opacity: .25; position: relative; }
  .objects .gone::after { content: "✕"; position: absolute; inset: 0; color: var(--oops); font: 800 1em var(--fun); display: grid; place-items: center; }
  .objects.pairs { display: grid; grid-template-columns: repeat(2, auto); gap: 2px 18px; max-width: none; }
  .math-choices { grid-template-columns: repeat(2, 1fr); max-width: 420px; }
  .math-choices button { aspect-ratio: auto; min-height: 84px; font: 700 clamp(1.8rem, 8vw, 2.6rem) var(--read); padding: 10px; }
  .math-choices button svg { width: 72px; height: 72px; display: block; margin: 0 auto; }
  .math-choices button small.en { font-size: .45em; }
  .blocks { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
  .rods { display: flex; gap: 6px; }
  .rod { display: grid; grid-template-rows: repeat(10, 14px); gap: 2px; }
  .rod i, .cube { display: block; width: 16px; height: 14px; background: var(--wave); border-radius: 3px; }
  .cubes { display: grid; grid-template-columns: repeat(5, 16px); gap: 3px; }
  .cube { background: var(--orange); }
  .clock svg { display: block; }

  /* ---------- colors and numbers ---------- */
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .swatch {
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px;
    background: #fff; color: var(--ink); border: 3px solid var(--line); border-radius: 18px;
  }
  .swatch.on { border-color: var(--sun); background: #fff7df; }
  .swatch .dot { width: 64px; height: 64px; border-radius: 50%; border: 3px solid rgba(29,53,87,.15); }
  .swatch .sw-e { font-size: 1.6rem; line-height: 1; }
  .nw { font: 700 1.25rem var(--read); }
  .num-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .num-tile, .num-banner {
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px;
    background: #fff; color: var(--ink); border: 3px solid var(--line); border-radius: 18px;
  }
  .num-tile .digit, .num-banner .digit { font: 800 2.4rem/1 var(--fun); color: var(--wave); font-variant-numeric: tabular-nums; }
  .tadigit { font: 700 1.3rem var(--read); color: var(--berry); }
  .num-tile .nw { font-size: 1.05rem; text-align: center; overflow-wrap: anywhere; }
  .num-banner { cursor: default; margin-bottom: 12px; background: var(--sky); border: 0; }
  .num-banner .digit { font-size: 3.2rem; }
  .hundred { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .num-cell {
    cursor: pointer; aspect-ratio: 1; max-width: 100%; font: 700 clamp(.8rem, 3.2vw, 1.15rem) var(--fun);
    background: #fff; color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 0; font-variant-numeric: tabular-nums;
  }
  .num-cell:nth-child(10n) { border-color: var(--wave); }
  .num-cell.on { background: var(--sun); border-color: var(--sun); }
  .color-choices { grid-template-columns: repeat(2, 1fr); max-width: 360px; }
  .color-choices button { border-color: rgba(29,53,87,.2); }

  /* ---------- world ---------- */
  .map-wrap { background: #bfe3f5; border-radius: 18px; overflow: hidden; margin: 6px 0; }
  .world-map { display: block; width: 100%; height: auto; max-height: 70vh; }
  .world-map .countries path, .world-map .countries circle { stroke: #fff; stroke-width: .5; cursor: pointer; vector-effect: non-scaling-stroke; }
  .world-map .countries .dot { stroke: #1d3557; stroke-width: .6; }
  .world-map .hl { stroke: #1d3557; stroke-width: 1.8; }
  .world-map .blink { animation: blink .8s ease-in-out infinite alternate; }
  @keyframes blink { to { opacity: .35; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--ink-soft); margin: 8px 0; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .zoom-chips button { font-size: .85rem; padding: 5px 11px; }
  .country-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .country-list button { font: 400 .95rem var(--read); color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .flag-code { font: 800 .8em var(--fun); background: var(--ink); color: #fff; border-radius: 4px; padding: 2px 4px; }
  .postcard {
    margin: 12px 0; padding: 16px; border-radius: 22px; background: #fff;
    border: 4px solid var(--cc); box-shadow: 0 6px 0 var(--line);
  }
  .pc-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pc-head > div { flex: 1; min-width: 0; }
  .pc-head h3 { font: 800 clamp(1.5rem, 6vw, 2rem)/1.1 var(--fun); margin: 0; }
  .pc-head p { margin: 2px 0 0; color: var(--ink-soft); }
  .pc-head .btn { margin-left: auto; padding: 10px 16px; font-size: 1rem; }
  .pc-flag { font-size: clamp(3.4rem, 14vw, 4.6rem); line-height: 1; }
  .pc-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-top: 12px; }
  .pc-map { background: #bfe3f5; border-radius: 16px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; }
  .pc-map svg { width: 100%; height: 100%; }
  .pc-facts { margin: 0; display: grid; gap: 8px; align-content: start; }
  .pc-facts div { background: var(--sky); border-radius: 12px; padding: 6px 10px; }
  .pc-facts dt { font: 700 .8rem var(--fun); color: var(--ink-soft); }
  .pc-facts dd { margin: 0; font: 700 1.05rem var(--read); overflow-wrap: anywhere; }
  .pc-sub { font: 700 1rem var(--fun); margin: 14px 0 6px; }
  .pc-things { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .thing { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; background: #fff7df; border-radius: 14px; padding: 8px 6px; }
  .thing span { font-size: 2.3rem; line-height: 1.1; }
  .thing small { font-size: .85rem; line-height: 1.2; }
  .pc-fact { background: var(--sky); border-radius: 14px; padding: 10px 14px; margin: 12px 0 0; font-size: 1.05rem; }
  .pc-note { color: var(--ink-soft); margin: 8px 0 0; }
  .cont-card { border-left: 8px solid var(--cc); background: #fff; border-radius: 14px; padding: 10px 14px; margin: 10px 0; }
  .cont-card h3 { margin: 0 0 4px; font-family: var(--fun); }
  .cont-card p { margin: 4px 0; }
  .flag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 10px; }
  .flag-grid button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; cursor: pointer; background: #fff; color: var(--ink); border: 2px solid var(--line); border-radius: 14px; }
  .flag-grid .f { font-size: 2.2rem; line-height: 1.1; }
  .flag-grid small { font-size: .78rem; text-align: center; line-height: 1.15; }
  .big-flag { text-align: center; font-size: clamp(6rem, 30vw, 9rem); line-height: 1.1; margin: 4px 0 12px; }
  .big-flag.small { font-size: 4rem; }
  .world-choices { grid-template-columns: repeat(2, 1fr); max-width: 520px; }
  .world-choices button { min-height: 72px; font-size: clamp(1.1rem, 4.5vw, 1.4rem); }
  @media (max-width: 560px) { .pc-body { grid-template-columns: 1fr; } }

  /* ---------- chess ---------- */
  .chess-board {
    position: relative; display: grid; grid-template-columns: repeat(8, 1fr);
    width: min(100%, 520px); aspect-ratio: 1; margin: 10px auto; border: 6px solid #6b4f3a; border-radius: 10px; overflow: hidden;
  }
  .chess-board.small { width: min(100%, 320px); }
  .sq { position: relative; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center; aspect-ratio: 1; }
  .sq.light { background: #f3dfbf; }
  .sq.dark { background: #b58863; }
  .sq.last { box-shadow: inset 0 0 0 100px rgba(255, 201, 60, .45); }
  .sq.sel { box-shadow: inset 0 0 0 100px rgba(63, 166, 107, .55); }
  .sq.check { box-shadow: inset 0 0 0 100px rgba(232, 74, 127, .7); }
  .sq:focus-visible { outline: 3px solid var(--wave); outline-offset: -3px; }
  .pc { font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", serif; font-size: min(9.5vw, 50px); line-height: 1; }
  .pc.white { color: #fff; -webkit-text-stroke: 1.6px #2b2018; paint-order: stroke fill; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .pc.black { color: #1c1410; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
  .pc.mini { font-size: 1.1em; }
  .sq .star { font-size: min(7vw, 34px); }
  .sq .dot { position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(29, 53, 87, .45); }
  .sq .cap { position: absolute; inset: 6%; border-radius: 50%; border: 5px solid rgba(232, 74, 127, .8); }
  .sq .rk, .sq .fl { position: absolute; font: 700 10px var(--fun); color: rgba(43, 32, 24, .7); }
  .sq .rk { top: 2px; left: 3px; }
  .sq .fl { bottom: 1px; right: 3px; }
  .promo { position: absolute; inset: 20% 6%; background: var(--paper); border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.35); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 10px; z-index: 2; }
  .promo p { width: 100%; text-align: center; margin: 0; font: 700 1.1rem var(--fun); }
  .promo button { display: flex; flex-direction: column; align-items: center; background: #f3dfbf; border: 2px solid #b58863; border-radius: 12px; padding: 6px 10px; cursor: pointer; }
  .lesson { background: var(--sky); border-radius: 18px; padding: 12px 16px; margin: 8px 0; }
  .lesson h3 { margin: 0 0 6px; font-family: var(--fun); }
  .lesson p { margin: 6px 0; max-width: 62ch; }
  .lesson-chips button { font-size: .9rem; }
  .game-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .turn { font: 800 1.2rem var(--fun); margin: 0; padding: 6px 14px; border-radius: 999px; }
  .turn.t-white { background: #fff; border: 2px solid var(--line); }
  .turn.t-black { background: #2b2018; color: #fff; }
  .turn.is-check { background: var(--berry); color: #fff; }
  .taken { min-height: 28px; display: flex; flex-wrap: wrap; gap: 0; }
  .taken .pc { font-size: 24px; }
  .game-btns { margin-top: 8px; }
  .auto-flip { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 12px 0 0; font-size: .95rem; }
  .auto-flip input { width: 22px; height: 22px; }

  /* ---------- sound check ---------- */
  dialog.sheet {
    border: 0; border-radius: 24px; padding: 20px; width: min(560px, calc(100% - 32px));
    background: var(--paper); color: var(--ink); box-shadow: 0 20px 60px rgba(29,53,87,.35);
  }
  dialog.sheet::backdrop { background: rgba(29,53,87,.35); }
  .sheet h2 { font-family: var(--fun); margin: 0 0 6px; }
  .voice-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 12px 0; border-top: 2px solid var(--line); }
  .voice-row .status { font-size: .95rem; }
  .voice-row .status.bad { color: var(--oops); }
  .voice-row .status.good { color: var(--ok); }
  .voice-row select { grid-column: 1 / -1; font: 1rem var(--read); padding: 6px; border-radius: 10px; border: 2px solid var(--line); background: #fff; color: var(--ink); max-width: 100%; }
  .tips { font-size: .92rem; color: var(--ink-soft); padding-left: 1.1em; margin: 8px 0 0; }
  .tips li { margin-bottom: 6px; }
  .speed { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 2px solid var(--line); }
  .speed input { flex: 1; }

  .toast {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    z-index: 10; width: min(520px, calc(100% - 32px));
    display: flex; gap: 10px; align-items: center; justify-content: space-between;
    background: var(--ink); color: var(--paper); border-radius: 18px; padding: 12px 14px; font-size: .95rem;
  }
  .toast .x { background: transparent; color: var(--paper); padding: 8px 6px; }
  .toast button { font: 700 .95rem var(--fun); border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; background: var(--sun); color: var(--ink); white-space: nowrap; }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  footer { text-align: center; color: var(--ink-soft); font-size: .9rem; }

  @media (max-width: 560px) {
    nav { gap: 6px; }
    nav > button { flex: 0 0 calc((100% - 12px) / 3); min-width: 0; }
    nav button { font-size: .72rem; padding: 8px 2px; border-radius: 14px; }
    nav button .ic { font-size: 1.35rem; }
    .controls { flex-direction: row; flex-wrap: wrap; align-items: center; width: 100%; justify-content: space-between; }
    .lang button { padding: 8px 10px; font-size: .9rem; }
    .letter-card { grid-template-columns: 1fr; text-align: center; justify-items: center; }
    .big-letter { font-size: 4rem; }
    .panel { padding: 16px; }
    .shelf { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <div>
      <p class="hello" id="hello"></p>
      <h1 class="name" id="name"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="controls">
      <div class="control-row">
        <div class="stars" aria-live="polite">⭐ <span id="starCount">0</span></div>
        <button type="button" class="sound-btn" id="soundBtn">🔊 <span id="soundLabel">Sound</span></button>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="fr" aria-pressed="false">Français</button>
        <button type="button" data-lang="ta" aria-pressed="false">தமிழ்</button>
      </div>
    </div>
  </header>

  <nav role="tablist" id="tabs"></nav>

  <main class="panel" id="panel"></main>

  <footer id="footer"></footer>
</div>

<dialog class="sheet" id="soundSheet"></dialog>
<div class="toast" id="toast" hidden></div>
<canvas class="confetti" id="confetti"></canvas>

<script src="data/words.js"></script>
<script src="data/books-en.js"></script>
<script src="data/books-fr.js"></script>
<script src="data/books-ta.js"></script>
<script src="data/world.js"></script>
<script src="world.js"></script>
<script src="chess.js"></script>
<script src="app.js"></script>
</body>
