<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ahara's Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Sniglet:wght@400;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --sky: #dff1f7;
    --paper: #fffdf7;
    --ink: #1d3557;
    --ink-soft: #52698a;
    --sun: #ffc93c;
    --berry: #e84a7f;
    --leaf: #3fa66b;
    --wave: #2f8fd8;
    --plum: #8a5cc7;
    --orange: #f28a2e;
    --line: #c9dde8;
    --ok: #3fa66b;
    --oops: #e8603c;
    --read: "Andika", "Comic Sans MS", system-ui, sans-serif;
    --fun: "Sniglet", "Andika", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--sky);
    color: var(--ink);
    font-family: var(--read);
    font-size: 18px;
    overflow-x: hidden;
  }

  /* ---------- backdrop: her name, big and soft ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .backdrop span {
    position: absolute;
    font-family: var(--fun);
    font-weight: 800;
    line-height: 1;
    opacity: .13;
    white-space: nowrap;
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translateY(0) rotate(var(--r)); }
    to   { transform: translateY(-24px) rotate(calc(var(--r) + 4deg)); }
  }

  .wrap {
    position: relative; z-index: 1;
    max-width: 880px; margin: 0 auto;
    padding-inline: 16px; padding-block: 16px 48px;
    display: flex; flex-direction: column; gap: 16px;
  }

  /* ---------- header ---------- */
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .hello { font-family: var(--fun); font-size: 1.05rem; color: var(--ink-soft); margin: 0; }
  .name {
    display: flex; gap: 2px; margin: 0; font-family: var(--fun); font-weight: 800;
    font-size: clamp(3rem, 12vw, 5.2rem); line-height: .95;
  }
  .name button {
    all: unset; cursor: pointer; display: inline-block; transition: transform .15s;
    text-shadow: 0 4px 0 rgba(29,53,87,.15);
  }
  .name button:hover { transform: translateY(-4px) rotate(-4deg); }
  .name button:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; border-radius: 8px; }
  .name button.pop { animation: pop .45s; }
  @keyframes pop { 50% { transform: scale(1.3) rotate(8deg); } }
  .sub { font-family: var(--fun); font-size: 1.15rem; margin: 4px 0 0; }

  .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .stars {
    font-family: var(--fun); font-size: 1.3rem; background: var(--paper);
    border: 3px solid var(--sun); border-radius: 999px; padding: 4px 16px;
    font-variant-numeric: tabular-nums;
  }
  .lang { display: flex; background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 3px; }
  .lang button {
    font: 700 1rem var(--fun); border: 0; background: transparent; color: var(--ink);
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* ---------- tabs ---------- */
  nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  nav button {
    font: 700 1rem var(--fun); color: var(--ink); cursor: pointer;
    background: var(--paper); border: 3px solid var(--line); border-radius: 18px;
    padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav button .ic { font-size: 1.6rem; line-height: 1; }
  nav button[aria-selected="true"] { border-color: var(--tab, var(--wave)); background: var(--tab, var(--wave)); color: #fff; }
  button:focus-visible { outline: 3px dashed var(--ink); outline-offset: 2px; }

  .panel {
    background: var(--paper); border-radius: 28px; padding: 20px;
    box-shadow: 0 6px 0 var(--line);
  }
  .panel h2 { font-family: var(--fun); font-size: 1.5rem; margin: 0 0 4px; text-wrap: balance; }
  .hint { color: var(--ink-soft); margin: 0 0 16px; }

  /* ---------- letters ---------- */
  .alpha { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
  .alpha button {
    font: 700 1.9rem var(--read); aspect-ratio: 1; max-width: 100%; cursor: pointer;
    border: 3px solid var(--line); border-radius: 16px; background: #fff; color: var(--ink);
  }
  .alpha button.in-name { border-color: var(--berry); color: var(--berry); }
  .alpha button.on { background: var(--sun); border-color: var(--sun); color: var(--ink); }
  .letter-card {
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px 24px;
    margin-bottom: 18px; padding: 16px; border-radius: 20px; background: var(--sky);
  }
  .big-letter { font: 700 5rem/1 var(--read); color: var(--berry); }
  .big-letter small { font-size: .6em; color: var(--ink); }
  .pic { font-size: 3.6rem; line-height: 1; }
  .letter-card .word { font: 700 2rem var(--read); }
  .letter-card .word b { color: var(--berry); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .note { font-family: var(--fun); color: var(--berry); margin: 4px 0 0; }

  /* ---------- words ---------- */
  .word-stage { text-align: center; padding: 12px 0 20px; }
  .word-stage .pic { font-size: 5.5rem; }
  .syll { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
  .syll button {
    font: 700 clamp(2rem, 9vw, 3.2rem) var(--read); cursor: pointer; color: var(--ink);
    background: #fff; border: 3px solid var(--line); border-radius: 16px; padding: 4px 14px;
  }
  .syll button:nth-child(odd) { border-bottom-color: var(--wave); }
  .syll button:nth-child(even) { border-bottom-color: var(--berry); }
  .syll button.on { background: var(--sun); }

  .btn {
    font: 700 1.1rem var(--fun); cursor: pointer; border: 0; border-radius: 999px;
    padding: 12px 22px; background: var(--wave); color: #fff; box-shadow: 0 4px 0 rgba(29,53,87,.25);
  }
  .btn.alt { background: #fff; color: var(--ink); border: 3px solid var(--line); box-shadow: none; }
  .btn:active { transform: translateY(2px); box-shadow: none; }
  .btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

  /* ---------- sentences ---------- */
  .story { display: flex; flex-direction: column; gap: 14px; }
  .sentence {
    display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center;
    padding: 14px; border-radius: 20px; background: var(--sky);
  }
  .sentence .pic { font-size: 3rem; }
  .sentence .words { display: flex; flex-wrap: wrap; gap: 4px 8px; font: 700 clamp(1.4rem, 5vw, 2rem) var(--read); }
  .sentence .words button {
    all: unset; cursor: pointer; border-radius: 8px; padding: 0 4px;
  }
  .sentence .words button:focus-visible { outline: 3px dashed var(--ink); }
  .sentence .words button.hi { background: var(--sun); }
  .sentence .words button.her { color: var(--berry); }
  .sentence .play { grid-column: 1 / -1; justify-self: start; padding: 8px 16px; font-size: 1rem; }

  /* ---------- quiz ---------- */
  .quiz-word { text-align: center; font: 700 clamp(2.6rem, 12vw, 4rem) var(--read); margin: 8px 0 18px; }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 520px; margin-inline: auto; }
  .choices button {
    font-size: clamp(3rem, 14vw, 4.5rem); cursor: pointer; aspect-ratio: 1; max-width: 100%;
    background: #fff; border: 4px solid var(--line); border-radius: 24px;
  }
  .choices button.right { border-color: var(--ok); background: #e6f6ec; animation: pop .45s; }
  .choices button.wrong { border-color: var(--oops); animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .feedback { text-align: center; min-height: 2.2em; font: 800 1.5rem var(--fun); margin: 14px 0 6px; }
  .feedback.good { color: var(--ok); }
  .feedback.bad { color: var(--oops); }
  .progress { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
  .progress i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .progress i.done { background: var(--sun); }

  /* ---------- name game ---------- */
  .slots, .tiles { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .slots span {
    width: clamp(48px, 14vw, 72px); aspect-ratio: 1; display: grid; place-items: center;
    border: 3px dashed var(--line); border-radius: 16px; font: 800 2.4rem var(--fun);
  }
  .slots span.filled { border-style: solid; border-color: var(--berry); background: #fde9f0; }
  .tiles { margin-top: 20px; }
  .tiles button {
    width: clamp(48px, 14vw, 72px); aspect-ratio: 1; font: 800 2.4rem var(--fun); cursor: pointer;
    border: 0; border-radius: 16px; color: #fff; box-shadow: 0 5px 0 rgba(29,53,87,.25);
  }
  .tiles button:disabled { opacity: .2; cursor: default; box-shadow: none; }
  .celebrate { text-align: center; font: 800 1.8rem var(--fun); color: var(--berry); min-height: 1.4em; margin: 18px 0 8px; }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  footer { text-align: center; color: var(--ink-soft); font-size: .9rem; }

  @media (max-width: 560px) {
    nav { grid-template-columns: repeat(5, 1fr); gap: 5px; }
    nav button { font-size: .72rem; padding: 8px 2px; border-radius: 14px; }
    nav button .ic { font-size: 1.35rem; }
    .controls { flex-direction: row; align-items: center; width: 100%; justify-content: space-between; }
    .letter-card { grid-template-columns: 1fr; text-align: center; justify-items: center; }
    .big-letter { font-size: 4rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <div>
      <p class="hello" id="hello">Hello, reader!</p>
      <h1 class="name" id="name" aria-label="Ahara"></h1>
      <p class="sub" id="sub">Reading Room</p>
    </div>
    <div class="controls">
      <div class="stars" aria-live="polite">⭐ <span id="starCount">0</span></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="fr" aria-pressed="false">Français</button>
      </div>
    </div>
  </header>

  <nav role="tablist" id="tabs"></nav>

  <main class="panel" id="panel" aria-live="polite"></main>

  <footer id="footer">Tap anything to hear it out loud.</footer>
</div>

<canvas class="confetti" id="confetti"></canvas>

<script>
/* ============ Change the name here ============ */
const CHILD = "Ahara";

const COLORS = ["#e84a7f", "#2f8fd8", "#3fa66b", "#f28a2e", "#8a5cc7", "#ffc93c"];

/* ---------- content ---------- */
const LETTERS = {
  en: [
    ["A","Apple","🍎"],["B","Ball","⚽"],["C","Cat","🐱"],["D","Dog","🐶"],["E","Egg","🥚"],
    ["F","Fish","🐟"],["G","Grapes","🍇"],["H","Hat","🎩"],["I","Ice cream","🍦"],["J","Juice","🧃"],
    ["K","Kite","🪁"],["L","Lion","🦁"],["M","Moon","🌙"],["N","Nest","🪺"],["O","Owl","🦉"],
    ["P","Pig","🐷"],["Q","Queen","👑"],["R","Rabbit","🐰"],["S","Sun","☀️"],["T","Tree","🌳"],
    ["U","Umbrella","☂️"],["V","Van","🚐"],["W","Whale","🐳"],["X","Fox","🦊"],["Y","Yo-yo","🪀"],["Z","Zebra","🦓"]
  ],
  fr: [
    ["A","Ananas","🍍"],["B","Banane","🍌"],["C","Chat","🐱"],["D","Dauphin","🐬"],["E","Éléphant","🐘"],
    ["F","Fraise","🍓"],["G","Gâteau","🎂"],["H","Hibou","🦉"],["I","Île","🏝️"],["J","Jus","🧃"],
    ["K","Koala","🐨"],["L","Lune","🌙"],["M","Maison","🏠"],["N","Nuage","☁️"],["O","Oiseau","🐦"],
    ["P","Pomme","🍎"],["Q","Quatre","4️⃣"],["R","Robot","🤖"],["S","Soleil","☀️"],["T","Tortue","🐢"],
    ["U","Un","1️⃣"],["V","Vache","🐄"],["W","Wagon","🚃"],["X","Taxi","🚕"],["Y","Yoyo","🪀"],["Z","Zèbre","🦓"]
  ]
};

// word, syllables, picture
const WORDS = {
  en: [
    ["cat",["cat"],"🐱"],["sun",["sun"],"☀️"],["dog",["dog"],"🐶"],["pig",["pig"],"🐷"],
    ["hat",["hat"],"🎩"],["bed",["bed"],"🛏️"],["fish",["fish"],"🐟"],["frog",["frog"],"🐸"],
    ["duck",["duck"],"🦆"],["star",["star"],"⭐"],["moon",["moon"],"🌙"],["book",["book"],"📖"],
    ["cake",["cake"],"🍰"],["tree",["tree"],"🌳"],["apple",["ap","ple"],"🍎"],["rabbit",["rab","bit"],"🐰"],
    ["monkey",["mon","key"],"🐵"],["turtle",["tur","tle"],"🐢"],["banana",["ba","na","na"],"🍌"],
    ["butterfly",["but","ter","fly"],"🦋"]
  ],
  fr: [
    ["chat",["chat"],"🐱"],["lune",["lu","ne"],"🌙"],["pomme",["pom","me"],"🍎"],["vache",["va","che"],"🐄"],
    ["bébé",["bé","bé"],"👶"],["moto",["mo","to"],"🏍️"],["vélo",["vé","lo"],"🚲"],["lapin",["la","pin"],"🐰"],
    ["poule",["pou","le"],"🐔"],["livre",["li","vre"],"📖"],["soleil",["so","leil"],"☀️"],["gâteau",["gâ","teau"],"🎂"],
    ["cheval",["che","val"],"🐴"],["fleur",["fleur"],"🌸"],["étoile",["é","toi","le"],"⭐"],["tomate",["to","ma","te"],"🍅"],
    ["banane",["ba","na","ne"],"🍌"],["tortue",["tor","tue"],"🐢"],["papillon",["pa","pi","llon"],"🦋"],
    ["éléphant",["é","lé","phant"],"🐘"]
  ]
};

const SENTENCES = {
  en: [
    ["{n} has a red ball.","⚽"],["The cat is on the mat.","🐱"],["I see the big sun.","☀️"],
    ["{n} can read!","📖"],["The dog runs fast.","🐶"],["{n} likes to jump.","🤸"],
    ["The fish can swim.","🐟"],["Good night, {n}. I love you.","🌙"]
  ],
  fr: [
    ["{n} a un petit chat.","🐱"],["Le soleil est jaune.","☀️"],["{n} lit un livre.","📖"],
    ["La vache dit meuh.","🐄"],["Le lapin saute.","🐰"],["{n} aime les fraises.","🍓"],
    ["Papa et maman aiment {n}.","❤️"],["Bonne nuit, {n}.","🌙"]
  ]
};

const UI = {
  en: {
    hello: n => `Hello, ${n}!`, sub: "Reading Room",
    tabs: ["Letters","Words","Read","Play","My name"],
    footer: "Tap anything to hear it out loud.",
    lettersH: "The alphabet", lettersHint: n => `Tap a letter. The pink ones are in your name, ${n}!`,
    isFor: (l,w) => `${l} is for ${w}`, inName: n => `This letter is in ${n}!`,
    wordsH: "Sound it out", wordsHint: "Tap each part, then say the whole word.",
    hear: "Hear it", next: "Next word", prev: "Back",
    readH: n => `${n}'s little stories`, readHint: "Tap a word to hear it, or press Read to me.",
    readMe: "Read to me",
    playH: "Find the picture", playHint: n => `Read the word, ${n}, then tap the matching picture.`,
    help: "Help me", good: n => [`Great job, ${n}!`,`You did it, ${n}!`,`Super reading!`,`Wow, ${n}!`],
    bad: "Try again!", newGame: "Play again", done: n => `All done! You are a star, ${n}!`,
    nameH: n => `Spell ${n}`, nameHint: "Tap the letters in the right order.",
    nameDone: n => `Yay! That is your name, ${n}!`, again: "Again!",
    spellSay: n => `${n}. ${n.split("").join(", ")}. ${n}!`
  },
  fr: {
    hello: n => `Bonjour, ${n} !`, sub: "Coin lecture",
    tabs: ["Lettres","Mots","Lire","Jouer","Mon nom"],
    footer: "Touche n'importe quoi pour l'entendre.",
    lettersH: "L'alphabet", lettersHint: n => `Touche une lettre. Les roses sont dans ton nom, ${n} !`,
    isFor: (l,w) => `${l} comme ${w}`, inName: n => `Cette lettre est dans ${n} !`,
    wordsH: "Syllabe par syllabe", wordsHint: "Touche chaque syllabe, puis dis le mot entier.",
    hear: "Écouter", next: "Mot suivant", prev: "Retour",
    readH: n => `Les petites histoires de ${n}`, readHint: "Touche un mot pour l'entendre, ou appuie sur Lis-moi.",
    readMe: "Lis-moi",
    playH: "Trouve l'image", playHint: n => `Lis le mot, ${n}, puis touche la bonne image.`,
    help: "Aide-moi", good: n => [`Bravo, ${n} !`,`Super, ${n} !`,`Tu lis très bien !`,`Génial, ${n} !`],
    bad: "Essaie encore !", newGame: "Rejouer", done: n => `Fini ! Tu es une étoile, ${n} !`,
    nameH: n => `Écris ${n}`, nameHint: "Touche les lettres dans le bon ordre.",
    nameDone: n => `Youpi ! C'est ton nom, ${n} !`, again: "Encore !",
    spellSay: n => `${n}. ${n.split("").join(", ")}. ${n} !`
  }
};
const TAB_ICONS = ["🔤","🧩","📚","🎯","💖"];
const TAB_COLORS = ["#2f8fd8","#3fa66b","#8a5cc7","#f28a2e","#e84a7f"];

/* ---------- state ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("ahara:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ahara:" + k, JSON.stringify(v)); } catch {} }
};
let lang = store.get("lang", "en");
let tab = Math.min(4, Math.max(0, store.get("tab", 0) | 0));
let stars = store.get("stars", 0);
let letterIdx = 0, wordIdx = 0;
let quiz = null, nameGame = null;
const t = () => UI[lang];
const fill = s => s.replaceAll("{n}", CHILD);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const nameLetters = new Set(CHILD.toUpperCase().normalize("NFD").replace(/[^A-Z]/g, ""));

/* ---------- speech ---------- */
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch {} }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(text, opts = {}) {
  if (!("speechSynthesis" in window)) return null;
  const l = opts.lang || lang;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = l === "fr" ? "fr-FR" : "en-US";
  const v = voices.find(v => v.lang.replace("_", "-").toLowerCase().startsWith(l === "fr" ? "fr" : "en"));
  if (v) u.voice = v;
  u.rate = opts.rate || 0.8;
  u.pitch = 1.1;
  if (opts.onboundary) u.onboundary = opts.onboundary;
  if (opts.onend) u.onend = opts.onend;
  speechSynthesis.speak(u);
  return u;
}

/* ---------- backdrop + header ---------- */
function drawBackdrop() {
  const bd = document.getElementById("backdrop");
  bd.innerHTML = "";
  const spots = [[-4,4,18,-8],[40,-2,11,6],[62,30,22,-4],[-8,48,14,10],[30,62,24,-6],[70,78,12,8],[8,86,16,-3],[50,14,8,12]];
  spots.forEach(([x, y, size, r], i) => {
    const s = document.createElement("span");
    s.textContent = CHILD;
    s.style.left = x + "vw"; s.style.top = y + "vh";
    s.style.fontSize = size + "vw";
    s.style.color = COLORS[i % COLORS.length];
    s.style.setProperty("--r", r + "deg");
    s.style.animationDelay = (-i * 2.3) + "s";
    bd.appendChild(s);
  });
}
function drawName() {
  const h = document.getElementById("name");
  h.innerHTML = "";
  [...CHILD].forEach((ch, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = ch;
    b.style.color = COLORS[i % COLORS.length];
    b.setAttribute("aria-label", ch);
    b.onclick = () => { b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); say(ch); };
    h.appendChild(b);
  });
}

function renderChrome() {
  document.documentElement.lang = lang;
  document.getElementById("hello").textContent = t().hello(CHILD);
  document.getElementById("sub").textContent = t().sub;
  document.getElementById("footer").textContent = t().footer;
  document.getElementById("starCount").textContent = stars;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  t().tabs.forEach((label, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", i === tab);
    b.style.setProperty("--tab", TAB_COLORS[i]);
    b.innerHTML = `<span class="ic" aria-hidden="true">${TAB_ICONS[i]}</span><span>${label}</span>`;
    b.onclick = () => { tab = i; store.set("tab", tab); quiz = null; nameGame = null; render(); };
    nav.appendChild(b);
  });
}

function addStar(n = 1) {
  stars += n; store.set("stars", stars);
  document.getElementById("starCount").textContent = stars;
}

/* ---------- views ---------- */
const panel = document.getElementById("panel");
const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function viewLetters() {
  const list = LETTERS[lang];
  const [L, word, pic] = list[letterIdx];
  const i = word.toUpperCase().normalize("NFD").indexOf(L);
  const wordHtml = i >= 0 ? esc(word.slice(0, i)) + "<b>" + esc(word.slice(i, i + 1)) + "</b>" + esc(word.slice(i + 1)) : esc(word);
  panel.innerHTML = `
    <h2>${t().lettersH}</h2>
    <p class="hint">${esc(t().lettersHint(CHILD))}</p>
    <div class="letter-card">
      <div class="big-letter">${L}<small>${L.toLowerCase()}</small></div>
      <div>
        <div class="row"><span class="pic" aria-hidden="true">${pic}</span><span class="word">${wordHtml}</span></div>
        ${nameLetters.has(L) ? `<p class="note">💖 ${esc(t().inName(CHILD))}</p>` : ""}
        <div class="row" style="margin-top:12px"><button class="btn" id="hearL" type="button">🔊 ${t().hear}</button></div>
      </div>
    </div>
    <div class="alpha" id="alpha"></div>`;
  const alpha = panel.querySelector("#alpha");
  list.forEach(([l], idx) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = l;
    if (nameLetters.has(l)) b.classList.add("in-name");
    if (idx === letterIdx) b.classList.add("on");
    b.onclick = () => { letterIdx = idx; viewLetters(); speakLetter(); };
    alpha.appendChild(b);
  });
  panel.querySelector("#hearL").onclick = speakLetter;
}
function speakLetter() {
  const [L, word] = LETTERS[lang][letterIdx];
  say(t().isFor(L, word));
}

function viewWords() {
  const list = WORDS[lang];
  const [word, syl, pic] = list[wordIdx];
  panel.innerHTML = `
    <h2>${t().wordsH}</h2>
    <p class="hint">${t().wordsHint}</p>
    <div class="word-stage">
      <div class="pic" aria-hidden="true">${pic}</div>
      <div class="syll" id="syll"></div>
      <div class="btns">
        <button class="btn alt" id="prevW" type="button">◀ ${t().prev}</button>
        <button class="btn" id="hearW" type="button">🔊 ${t().hear}</button>
        <button class="btn alt" id="nextW" type="button">${t().next} ▶</button>
      </div>
    </div>`;
  const box = panel.querySelector("#syll");
  syl.forEach(s => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = s;
    b.onclick = () => { box.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on"); say(s, { rate: 0.6 }); };
    box.appendChild(b);
  });
  panel.querySelector("#hearW").onclick = () => {
    box.querySelectorAll("button").forEach(x => x.classList.add("on"));
    say(word);
    setTimeout(() => box.querySelectorAll("button").forEach(x => x.classList.remove("on")), 1200);
  };
  panel.querySelector("#nextW").onclick = () => { wordIdx = (wordIdx + 1) % list.length; viewWords(); };
  panel.querySelector("#prevW").onclick = () => { wordIdx = (wordIdx - 1 + list.length) % list.length; viewWords(); };
}

function viewRead() {
  panel.innerHTML = `
    <h2>${esc(t().readH(CHILD))}</h2>
    <p class="hint">${t().readHint}</p>
    <div class="story" id="story"></div>`;
  const story = panel.querySelector("#story");
  SENTENCES[lang].forEach(([raw, pic]) => {
    const text = fill(raw);
    const row = el(`<div class="sentence"><span class="pic" aria-hidden="true">${pic}</span><div class="words"></div><button class="btn play" type="button">🔊 ${t().readMe}</button></div>`);
    const wbox = row.querySelector(".words");
    const tokens = text.split(" ");
    let offset = 0;
    const spans = tokens.map(tok => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = tok;
      b.dataset.start = offset; offset += tok.length + 1;
      if (tok.replace(/[^\p{L}]/gu, "") === CHILD) b.classList.add("her");
      b.onclick = () => { flash(b); say(tok.replace(/[.,!?]/g, "")); };
      wbox.appendChild(b);
      return b;
    });
    row.querySelector(".play").onclick = () => readSentence(text, spans);
    story.appendChild(row);
  });
}
function flash(b) { b.classList.add("hi"); setTimeout(() => b.classList.remove("hi"), 700); }
function readSentence(text, spans) {
  spans.forEach(s => s.classList.remove("hi"));
  let gotBoundary = false, timer;
  const light = i => { spans.forEach(s => s.classList.remove("hi")); if (spans[i]) spans[i].classList.add("hi"); };
  const u = say(text, {
    rate: 0.7,
    onboundary: e => {
      if (e.name && e.name !== "word") return;
      gotBoundary = true; clearInterval(timer);
      let idx = spans.findIndex(s => +s.dataset.start > e.charIndex) - 1;
      if (idx < 0) idx = e.charIndex >= +spans[spans.length - 1].dataset.start ? spans.length - 1 : 0;
      light(idx);
    },
    onend: () => { clearInterval(timer); spans.forEach(s => s.classList.remove("hi")); }
  });
  // Fallback for voices without word boundaries: step through at a steady pace.
  let i = 0;
  setTimeout(() => {
    if (gotBoundary) return;
    light(i);
    timer = setInterval(() => { i++; if (i >= spans.length) { clearInterval(timer); setTimeout(() => light(-1), 500); } else light(i); }, 480);
  }, 350);
  if (!u) setTimeout(() => clearInterval(timer), spans.length * 500 + 800);
}

function newQuiz() {
  const rounds = shuffle(WORDS[lang]).slice(0, 5);
  quiz = { rounds, i: 0, tries: 0, lang };
}
function viewPlay() {
  if (!quiz || quiz.lang !== lang) newQuiz();
  if (quiz.i >= quiz.rounds.length) {
    panel.innerHTML = `
      <h2>${t().playH}</h2>
      <div class="celebrate">🏆 ${esc(t().done(CHILD))}</div>
      <div class="btns"><button class="btn" id="again" type="button">${t().newGame}</button></div>`;
    panel.querySelector("#again").onclick = () => { newQuiz(); viewPlay(); };
    say(t().done(CHILD)); confetti();
    return;
  }
  const [word, , pic] = quiz.rounds[quiz.i];
  const others = shuffle(WORDS[lang].filter(w => w[2] !== pic)).slice(0, 2).map(w => w[2]);
  const options = shuffle([pic, ...others]);
  panel.innerHTML = `
    <h2>${t().playH}</h2>
    <p class="hint">${esc(t().playHint(CHILD))}</p>
    <div class="progress">${quiz.rounds.map((_, k) => `<i class="${k < quiz.i ? "done" : ""}"></i>`).join("")}</div>
    <div class="quiz-word">${esc(word)}</div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="fb"></div>
    <div class="btns"><button class="btn alt" id="helpQ" type="button">🔊 ${t().help}</button></div>`;
  const box = panel.querySelector("#choices"), fb = panel.querySelector("#fb");
  let locked = false;
  options.forEach(p => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = p;
    b.onclick = () => {
      if (locked) return;
      if (p === pic) {
        locked = true;
        b.classList.add("right");
        const msgs = t().good(CHILD), m = msgs[Math.random() * msgs.length | 0];
        fb.className = "feedback good"; fb.textContent = "⭐ " + m;
        addStar(); say(word + "! " + m);
        setTimeout(() => { quiz.i++; viewPlay(); }, 1700);
      } else {
        b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
        fb.className = "feedback bad"; fb.textContent = t().bad;
        say(t().bad);
      }
    };
    box.appendChild(b);
  });
  panel.querySelector("#helpQ").onclick = () => say(word, { rate: 0.6 });
}

function viewName() {
  const target = [...CHILD.toUpperCase()];
  if (!nameGame) nameGame = { pos: 0, tiles: shuffle(target.map((ch, i) => ({ ch, id: i, used: false }))) };
  panel.innerHTML = `
    <h2>${esc(t().nameH(CHILD))}</h2>
    <p class="hint">${t().nameHint}</p>
    <div class="slots" id="slots">${target.map((ch, i) => `<span class="${i < nameGame.pos ? "filled" : ""}">${i < nameGame.pos ? ch : ""}</span>`).join("")}</div>
    <div class="tiles" id="tiles"></div>
    <div class="celebrate" id="cel"></div>
    <div class="btns"><button class="btn alt" id="hearN" type="button">🔊 ${t().hear}</button></div>`;
  const tiles = panel.querySelector("#tiles");
  nameGame.tiles.forEach((tile, k) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = tile.ch; b.disabled = tile.used;
    b.style.background = COLORS[k % COLORS.length];
    b.onclick = () => {
      say(tile.ch);
      if (tile.ch === target[nameGame.pos]) {
        tile.used = true; nameGame.pos++;
        if (nameGame.pos === target.length) {
          viewName();
          const cel = panel.querySelector("#cel");
          cel.textContent = "🎉 " + t().nameDone(CHILD);
          const btns = panel.querySelector(".btns");
          const again = el(`<button class="btn" type="button">${t().again}</button>`);
          again.onclick = () => { nameGame = null; viewName(); };
          btns.appendChild(again);
          addStar(2); confetti();
          setTimeout(() => say(t().spellSay(CHILD), { rate: 0.75 }), 400);
        } else viewName();
      } else {
        b.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], { duration: 300 });
      }
    };
    tiles.appendChild(b);
  });
  panel.querySelector("#hearN").onclick = () => say(t().spellSay(CHILD), { rate: 0.75 });
}

/* ---------- confetti ---------- */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("confetti"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const bits = Array.from({ length: 120 }, () => ({
    x: Math.random() * c.width, y: -20 - Math.random() * c.height * .4,
    vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, r: 4 + Math.random() * 6,
    a: Math.random() * 6, col: COLORS[Math.random() * COLORS.length | 0]
  }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.a += .1; ctx.fillStyle = b.col; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillRect(-b.r / 2, -b.r / 4, b.r, b.r / 2); ctx.restore(); });
    if (++f < 150) requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}

/* ---------- boot ---------- */
const VIEWS = [viewLetters, viewWords, viewRead, viewPlay, viewName];
function render() { renderChrome(); VIEWS[tab](); }
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.lang; store.set("lang", lang);
  letterIdx = 0; wordIdx = 0; quiz = null;
  render();
  say(t().hello(CHILD));
});
drawBackdrop(); drawName(); render();
</script>
</body>
